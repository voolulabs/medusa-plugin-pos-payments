# Publish por tag (ADR 0006): tag v* na main → npm publish.
# Guard: a tag tem que bater com o version do package.json.
# Inerte até o secret NPM_TOKEN existir no environment "npm".
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Guard — tag bate com package.json (ADR 0006 §3)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./plugins/pos-payments/package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build (medusa plugin:build)
        working-directory: plugins/pos-payments
        run: pnpm exec medusa plugin:build

      - name: Publish (provenance)
        working-directory: plugins/pos-payments
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
